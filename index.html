<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Civilisation — World Simulator</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header id="topbar">
    <div id="title-block">
      <button id="btn-menu" class="ctrl-btn menu-btn">🏠 Menu</button>
      <span class="logo">CIVILISATION</span>
      <span id="world-date">Année 1 — Jour 1</span>
    </div>
    <div id="speed-controls">
      <button id="btn-pause" class="ctrl-btn active">⏸</button>
      <button id="btn-play"  class="ctrl-btn">▶ ×1</button>
      <button id="btn-x2"   class="ctrl-btn">▶▶ ×2</button>
      <button id="btn-x4"   class="ctrl-btn">▶▶▶ ×4</button>
      <button id="btn-x8"   class="ctrl-btn">⚡ ×8</button>
      <button id="btn-reset" class="ctrl-btn danger">↺</button>
    </div>
    <div id="save-controls">
      <button id="btn-save"   class="ctrl-btn">💾</button>
      <button id="btn-export" class="ctrl-btn">📤</button>
      <label for="import-file" class="ctrl-btn">📥</label>
      <input type="file" id="import-file" accept=".json" style="display:none"/>
    </div>
  </header>

  <div id="app-layout">
    <aside id="left-panel">
      <div class="panel-section">
        <h3 class="section-title">🌍 Monde</h3>
        <div id="world-stats"></div>
      </div>
      <div class="panel-section">
        <h3 class="section-title">📦 Ressources</h3>
        <div id="resource-stats"></div>
      </div>
      <div class="panel-section">
        <h3 class="section-title">🌿 Écosystème</h3>
        <div id="ecology-stats"></div>
      </div>
      <div class="panel-section">
        <h3 class="section-title">⚔ Guerres</h3>
        <div id="war-stats"></div>
      </div>
    </aside>

    <main id="canvas-area">
      <canvas id="main-canvas"></canvas>
      <div id="fps-overlay">FPS: -- | Entités: --</div>
      <div id="tooltip" class="hidden"></div>
    </main>

    <aside id="right-panel">
      <div class="panel-section">
        <h3 class="section-title">🔍 Sélection</h3>
        <div id="selection-info"><p class="muted">Cliquez sur une entité</p></div>
      </div>
      <div class="panel-section">
        <h3 class="section-title">🏙 Colonies</h3>
        <div id="city-list"></div>
      </div>
      <div class="panel-section">
        <h3 class="section-title">⚗ Technologies</h3>
        <div id="tech-list"></div>
      </div>
    </aside>
  </div>

  <footer id="bottom-panel">
    <div class="graph-block">
      <canvas id="graph-population" width="220" height="80"></canvas>
      <span class="graph-label">Population</span>
    </div>
    <div class="graph-block">
      <canvas id="graph-food" width="220" height="80"></canvas>
      <span class="graph-label">Nourriture</span>
    </div>
    <div class="graph-block">
      <canvas id="graph-animals" width="220" height="80"></canvas>
      <span class="graph-label">Animaux</span>
    </div>
    <div class="graph-block">
      <canvas id="graph-cities" width="220" height="80"></canvas>
      <span class="graph-label">Colonies</span>
    </div>
    <div class="graph-block">
      <canvas id="graph-resources" width="220" height="80"></canvas>
      <span class="graph-label">Ressources</span>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
